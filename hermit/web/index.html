<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="hermit-token" content="{{TOKEN}}">
  <title>Mantha Hermit</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn only-narrow" id="menu-btn" aria-label="Show chats and packs" aria-expanded="false" aria-controls="sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="/">
      <b>Mantha Hermit</b>
    </a>
    <nav class="crumbs" aria-label="Location">
      <span>Workspace</span><span class="sep">/</span><span class="here" id="crumb-here">Rule research</span>
      <span class="tag">Local</span>
    </nav>
    <div class="top-actions">
      <span class="conn" id="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Checking Ollama</span></span>
      <button class="btn btn-outline" id="new-chat" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Chats and packs">
    <div class="side-scroll">
      <section class="side-section">
        <div class="side-head">
          <h2>Chats</h2>
          <button class="icon-btn" id="search-btn" type="button" aria-label="Search chats" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
          </button>
        </div>
        <input class="field side-search" id="chat-search" type="search" placeholder="Search chats" hidden>
        <div id="chat-list"></div>
      </section>
      <section class="side-section">
        <div class="side-head"><h2>Rule packs</h2><span class="count" id="pack-count"></span></div>
        <div id="pack-list"></div>
      </section>
    </div>
    <div class="local-card">
      <div class="row"><span class="dot" id="local-dot"></span>Local inference</div>
      <code id="endpoint">127.0.0.1</code>
      <p>Requests, packs and signing keys stay on this machine.</p>
    </div>
  </aside>

  <main class="chat" id="chat">
    <div class="chat-head">
      <div class="grow">
        <h1 id="chat-title">New chat</h1>
        <p id="chat-sub"></p>
      </div>
      <label class="sr-only" for="model-select">Model</label>
      <select class="field model-select" id="model-select"></select>
      <button class="btn only-mid" id="pack-toggle" type="button" aria-controls="pack-panel" aria-expanded="false">Pack</button>
    </div>
    <div class="messages" id="messages" aria-live="polite"><div class="thread" id="thread"></div></div>
    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-box">
        <label class="sr-only" for="prompt">Request</label>
        <textarea id="prompt" rows="2" placeholder="Ask Hermit to add, remove or report on rules"></textarea>
        <div class="composer-row">
          <label class="toggle"><input type="checkbox" id="opt-model" checked> Use the model</label>
          <label class="toggle"><input type="checkbox" id="opt-fetch"> Fetch sources first</label>
          <label class="toggle"><input type="checkbox" id="opt-dry"> Dry run</label>
          <button class="send-btn send" id="send" type="submit" aria-label="Send request">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <p class="composer-foot"><span>Runs on this machine. No cloud API.</span><span>Enter to send, Shift+Enter for a new line</span></p>
    </form>
  </main>

  <aside class="pack-panel" id="pack-panel" aria-label="Current rule pack"></aside>
</div>

<dialog id="dialog" aria-labelledby="dlg-title">
  <div class="dlg-head"><h2 id="dlg-title"></h2>
    <button class="icon-btn" id="dlg-close" type="button" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
  <div class="dlg-foot" id="dlg-foot"></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>

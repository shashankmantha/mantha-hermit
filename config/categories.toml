# Packs that hermit sorts rules into. Everything here is data: edit freely, then re-run.
#
# How a rule is scored against a pack
#   1. File types. Each rule gets file types from its condition (MZ/ELF gates, pe/elf modules) and,
#      failing that, from its name, description and strings. If none of a rule's types is allowed
#      and one is denied, it is "not applicable" to the pack. Rules with no gate count as "any".
#      Types: pe elf macho ole pdf rtf zip lnk android webshell email memory script any
#   2. Signals. Each signal adds its weight once if any of its terms matches.
#      fields: name, tags, description (all meta text), reference, author, strings, condition,
#              targets (file types), name_prefix (rule name starts with the term)
#      Terms are case-insensitive and word-bounded ("rat" won't match "pirate"); a trailing *
#      allows any ending ("pirat*"). In the strings field terms are plain substrings.
#   3. Score >= include_score: in the pack. review_score..include_score-1: borderline, which the
#      local model judges (or review.csv lists, with --no-llm). Below: left out.
#
# Severity is proposed, never decided by the model: meta score (>=75 threat, >=60 suspicious,
# else info), then name prefix (MAL_/APT_ threat, SUSP_/HKTL_ suspicious, PUA_/INFO_ info),
# then the pack's severity_default. severity_cap limits it (riskware never raises the verdict).

[defaults]
# Mantha Ray editions that load a pack (bundle contract `editions`). "all" = every edition.
# Provisional until Mantha Ray's edition switchboard exists.
editions = ["standard"]
include_score = 4
review_score = 2
# Mantha Ray scans game folders and cracked software, not mail, documents, web servers or memory.
targets_deny = ["ole", "pdf", "rtf", "email", "webshell", "memory", "android", "macho", "lnk"]

# ---------------------------------------------------------------------------------------------
[categories.core-threats]
editions = ["all"]          # always loaded in every edition
aliases = ["core threats", "malware", "threats", "general malware"]
kind = "detection"
description = """Malware that could be hidden in a game folder or cracked program on a PC: \
information stealers, coin miners, loaders and droppers, remote-access trojans, ransomware, \
persistence, switching off defences, download-and-run and shellcode. Rules for Windows PE, \
Linux ELF or scripts. Not documents, web shells, phishing or memory-only rules."""
targets_allow = ["pe", "elf", "script", "zip"]
severity_default = "suspicious"

  [[categories.core-threats.signals]]
  label = "threat type"
  weight = 3
  fields = ["name", "tags", "description"]
  terms = ["stealer*", "infostealer*", "info stealer", "password stealer", "grabber", "clipper",
           "miner", "coinminer", "cryptominer", "cryptojack*", "xmrig", "monero",
           "loader", "dropper", "downloader", "backdoor", "rat", "remote access trojan",
           "keylogger", "botnet", "bot", "ransom*", "trojan*", "spyware", "rootkit", "bootkit",
           "injector", "shellcode", "process hollowing", "reflective", "persistence",
           "uac bypass", "amsi bypass", "defender exclusion", "disable defender", "wiper"]

  [[categories.core-threats.signals]]
  label = "family"
  weight = 3
  fields = ["name", "tags", "description"]
  terms = ["redline", "lumma*", "vidar", "raccoon", "stealc", "risepro", "rhadamanthys", "meduza",
           "phemedrone", "mystic", "cryptbot", "azorult", "agenttesla", "agent tesla", "formbook",
           "xloader", "snake keylogger", "amadey", "smokeloader", "smoke loader", "privateloader",
